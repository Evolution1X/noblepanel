<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Admin Authentication | Noble Node Portal</title>
  
  <link rel="icon" type="image/png" href="/static/images/logo.png">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <link rel="stylesheet" href="/static/css/style.css?v=5000">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background-color: var(--bg-dark);">

  <div style="width: 100%; max-width: 440px; padding: 2rem 1.5rem;">
    <div style="background-color: var(--bg-card); border: 1px solid var(--border-bright); border-radius: var(--radius-lg); padding: 2.5rem; text-align: center;">
      
      <div style="margin-bottom: 1.25rem; display: flex; justify-content: center;">
        <img src="/static/images/logo.png" alt="Noble Node" class="brand-logo-img" style="height: 52px; max-height: 52px;">
      </div>

      <h1 style="font-size: 1.6rem; margin-bottom: 0.5rem; font-family: var(--font-heading); color: #FFFFFF;">Restricted Admin Access</h1>
      <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 2rem;">Enter your admin password to unlock Noble Node management tools.</p>

      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group" style="text-align: left;">
          <label for="admin-username" style="display: flex; align-items: center; gap: 0.4rem; font-weight: 700;">Admin Username</label>
          <input type="text" id="admin-username" autocomplete="username" required style="font-size: 1rem; width: 100%; padding: 0.85rem 1rem; background: var(--bg-card-alt); border: 1px solid var(--border-muted); border-radius: 12px; color: #FFFFFF; margin-bottom: 1rem;">
          <label style="display: flex; align-items: center; gap: 0.4rem; font-weight: 700;">
            <i data-lucide="key"></i> Admin Password
          </label>
          <input type="password" id="admin-password" class="form-control" autocomplete="current-password" required style="font-size: 1.1rem; letter-spacing: 0.1em; width: 100%; padding: 0.85rem 1rem; background: var(--bg-card-alt); border: 1px solid var(--border-muted); border-radius: 12px; color: #FFFFFF;">
        </div>

        <div id="login-error" style="color: #F87171; font-size: 0.85rem; margin-bottom: 1rem; display: none;"></div>

        <button type="submit" class="btn btn-pill-white rocket-hover" style="width: 100%; padding: 0.85rem; justify-content: center; border-radius: 12px;">
          <i data-lucide="shield-check"></i> Authenticate & Enter
        </button>
      </form>

      <div style="margin-top: 2rem; padding-top: 1rem; border-top: 1px solid var(--border-muted);">
        <a href="/" style="color: var(--text-dim); text-decoration: none; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 0.4rem;">
          <i data-lucide="arrow-left"></i> Return to Client Website
        </a>
      </div>

    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (window.lucide && typeof window.lucide.createIcons === 'function') {
        window.lucide.createIcons();
      }
    });

    async function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('admin-username').value.trim();
      const password = document.getElementById('admin-password').value;
      const errorEl = document.getElementById('login-error');
      errorEl.style.display = 'none';

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: username, password: password })
        });
        const data = await res.json();

        if (data.success) {
          window.location.href = '{{ admin_url }}';
        } else {
          errorEl.innerText = data.message || 'Invalid Password';
          errorEl.style.display = 'block';
        }
      } catch (err) {
        errorEl.innerText = 'Server authentication error.';
        errorEl.style.display = 'block';
      }
    }
  </script>
</body>
</html>
